[build]
  command   = "npm run build"
  publish   = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# ── Multi-segment /api/* routes (must precede /api/* splat) ──────────────────
[[redirects]]
  from   = "/api/signals/live"
  to     = "/.netlify/functions/signals-live"
  status = 200

[[redirects]]
  from   = "/api/signals/history"
  to     = "/.netlify/functions/signals-history"
  status = 200

# ── General /api/* -> /.netlify/functions/* ─────────────────────────────────
[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/:splat"
  status = 200

# ── SPA fallback ─────────────────────────────────────────────────────────────
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# ── Dev server ────────────────────────────────────────────────────────────────
[dev]
  port      = 8888
  publish   = "."

# ── Function-specific settings ────────────────────────────────────────────────
[functions]
  node_bundler = "esbuild"

# ── Performance & Security Headers ────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/style.css"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=3600"

[[headers]]
  for = "/app.js"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=3600"

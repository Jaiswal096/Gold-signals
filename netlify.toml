[build]
  command   = "npm run build"
  publish   = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

# ── SPA fallback ─────────────────────────────────────────────────────────────
# All routes fall through to index.html so the Vanilla JS router handles them.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# ── Dev server ────────────────────────────────────────────────────────────────
[dev]
  command   = "npm run dev"
  port      = 8888
  targetPort = 5173
  publish   = "dist"

# ── Function-specific settings ────────────────────────────────────────────────
[functions]
  node_bundler = "esbuild"

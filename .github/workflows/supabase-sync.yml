name: Supabase Database Migration Sync

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/**'
  workflow_dispatch:

jobs:
  deploy-migrations:
    name: Verify Supabase Connectivity & Schema
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify Supabase REST Connectivity
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "SUPABASE_URL or SUPABASE_SERVICE_ROLE_KEY secret not set — skipping live check."
            exit 0
          fi
          node -e "
            fetch(process.env.SUPABASE_URL + '/rest/v1/signals?limit=1', {
              headers: {
                apikey: process.env.SUPABASE_SERVICE_ROLE_KEY,
                Authorization: 'Bearer ' + process.env.SUPABASE_SERVICE_ROLE_KEY
              }
            }).then(r => {
              console.log('Supabase REST status:', r.status);
              if (!r.ok) process.exitCode = 1;
            }).catch(err => {
              console.error('Supabase check failed:', err.message);
              process.exitCode = 1;
            });
          "
